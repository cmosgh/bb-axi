name: Release

# Publishes to npm via Trusted Publishing (OIDC): no npm token is stored
# anywhere, and the package gets a provenance attestation.
# Release flow:  npm version patch && git push --follow-tags
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Tag must match package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $version"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest
      # prepublishOnly runs the full check (typecheck, tests, build, skill freshness)
      - run: npm publish
